name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: aloo
            asset_name: aloo-linux-amd64
          
          # Linux ARM64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: aloo
            asset_name: aloo-linux-arm64

          # macOS x86_64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: aloo
            asset_name: aloo-macos-amd64
            
          # macOS ARM64 (Apple Silicon)
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: aloo
            asset_name: aloo-macos-arm64

          # Windows x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: aloo.exe
            asset_name: aloo-windows-amd64.exe

    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          
      - name: Install Cross (Linux only)
        if: runner.os == 'Linux'
        run: cargo install cross --git https://github.com/cross-rs/cross
        
      - name: Build Binary (macOS / Windows)
        if: runner.os != 'Linux'
        run: cargo build -p aloo-cli --release --target ${{ matrix.target }}
        
      - name: Build Binary (Linux with Cross)
        if: runner.os == 'Linux'
        run: cross build -p aloo-cli --release --target ${{ matrix.target }}
        
      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          
      - name: Archive Binaries
        run: |
          mkdir -p release-binaries
          # Move and rename all downloaded artifacts into the flat release folder
          find artifacts -type f -name "aloo*" -exec cp {} release-binaries/ \;
          
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-binaries/*
          draft: false
          prerelease: false
          generate_release_notes: true
